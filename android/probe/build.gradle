plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.zelda64recomp.probe'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.zelda64recomp.probe'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                targets 'zelda_android_probe'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.3'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
